# traefik/values.yaml
# Disable defaults to avoid port conflicts
ports:
  web:
    enabled: false
  websecure:
    enabled: false

  # Your 4 entrypoints exactly as requested
  http-external:
    port: 8080
    exposedPort: 8080
    expose:
      default: true
    protocol: TCP

  http-internal:
    port: 80
    exposedPort: 80
    expose:
      default: true
    protocol: TCP

  https-external:
    port: 8443
    exposedPort: 8443
    expose:
      default: true
    protocol: TCP
    tls:
      enabled: true

  https-internal:
    port: 443
    exposedPort: 443
    expose:
      default: true
    protocol: TCP
    tls:
      enabled: true

# Service (LoadBalancer so you get external IPs)
service:
  enabled: true
  type: LoadBalancer
  annotations: {}
  # ipFamilyPolicy: SingleStack   # uncomment if you need IPv4-only

# Dashboard (accessible via IngressRoute later or port-forward)
dashboard:
  enabled: true
  ingressRoute: true   # creates a default IngressRoute on the traefik entrypoint

# Persistence for acme.json (uncomment when you enable Cloudflare)
# persistence:
#   enabled: true
#   size: 128Mi
#   path: /certs

# Cloudflare ACME placeholder (leave blank for now = "default certs")
# Uncomment and fill when ready:
# additionalArguments:
#   - --entrypoints.https-external.http.tls.certresolver=cloudflare
#   - --entrypoints.https-internal.http.tls.certresolver=cloudflare
#
# certificatesResolvers:
#   cloudflare:
#     acme:
#       email: ""                    # ← your email
#       storage: /certs/acme.json
#       dnsChallenge:
#         provider: cloudflare
#         resolvers:
#           - "1.1.1.1:53"
#           - "8.8.8.8:53"

deployment:
  securityContext:
    capabilities:
      add: ["NET_BIND_SERVICE"]