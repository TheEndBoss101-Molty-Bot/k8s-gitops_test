# traefik/values.yaml
# Traefik v3 Helm Chart minimal values

# Global configuration
global:
  sendAnonymousUsage: false

# Deployment settings
deployment:
  replicas: 1
  securityContext:
    capabilities:
      add: ["NET_BIND_SERVICE"]

# Service configuration
service:
  enabled: true
  type: LoadBalancer
  annotations: {}

# Ingressroutes dashboard disabled
ingressRoute:
  dashboard:
    enabled: false

