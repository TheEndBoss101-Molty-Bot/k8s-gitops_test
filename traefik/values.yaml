# traefik/values.yaml
# Traefik v3 Helm Chart values

# Global configuration
global:
  sendAnonymousUsage: false

# Deployment settings
deployment:
  replicas: 1
  securityContext:
    capabilities:
      add: ["NET_BIND_SERVICE"]

# Service configuration
service:
  enabled: true
  type: LoadBalancer
  annotations: {}

# Ports/Entrypoints configuration
ports:
  traefik:
    port: 9000
    expose: false
  web:
    port: 80
    expose: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 443
    expose: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true

# Ingressroutes disabled (we'll create them separately)
ingressRoute:
  dashboard:
    enabled: false

