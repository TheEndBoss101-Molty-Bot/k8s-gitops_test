# traefik/values.yaml
# Traefik v3 Helm Chart values with custom entrypoints

# Global configuration
global:
  sendAnonymousUsage: false
logs:
  general:
    level: "DEBUG"

# Deployment settings
deployment:
  replicas: 2
  securityContext:
    capabilities:
      add: ["NET_BIND_SERVICE"]

# Service configuration
service:
  enabled: true
  type: LoadBalancer
  annotations: {}

# Custom entrypoints ONLY - no web/websecure
ports:
  web: 
    port: 80
    protocol: TCP
    expose:
      default: true
    exposedPort: 80
  websecure: 
    port: 443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
  web-external:
    port: 8080
    expose:
      default: true
    exposedPort: 8080
    protocol: TCP
  websecure-external:
    port: 8443
    expose:
      default: true
    exposedPort: 8443
    protocol: TCP
  traefik:
    port: 9000

# Ingressroutes dashboard disabled
ingressRoute:
  dashboard:
    enabled: false

