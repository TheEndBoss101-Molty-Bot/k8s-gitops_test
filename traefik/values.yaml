# traefik/values.yaml
# Traefik v3 Helm Chart values with custom entrypoints

# Global configuration
global:
  sendAnonymousUsage: false

# Deployment settings
deployment:
  replicas: 1
  securityContext:
    capabilities:
      add: ["NET_BIND_SERVICE"]

# Service configuration
service:
  enabled: true
  type: LoadBalancer
  annotations: {}

# Custom entrypoints (ports)
ports:
  traefik:
    port: 9000
  web:
    port: 80
  websecure:
    port: 443
  http-internal:
    port: 8080
    protocol: TCP
  https-internal:
    port: 8443
    protocol: TCP

# Ingressroutes dashboard disabled
ingressRoute:
  dashboard:
    enabled: false

