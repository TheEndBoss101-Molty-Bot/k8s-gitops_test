{{- range .Values.applications }}
{{- $config := $.Values.config -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "example.%s" .name | quote }}
  namespace: {{ .namespace | default "argocd" }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    # Fixed: safe default when .destination is missing (prevents the nil pointer error)
    namespace: {{ (default (dict) .destination).namespace | default .name | quote }}
    server: {{ $config.spec.destination.server | quote }}
  project: {{ .project | default "default" }}
  source:
    # Common fields with per-app overrides
    repoURL: {{ .repoURL | default $config.spec.source.repoURL | quote }}
    targetRevision: {{ .targetRevision | default $config.spec.source.targetRevision | quote }}

    # ── EXTERNAL HELM CHART LOGIC (new) ─────────────────────────────────────
    # If the app entry has "chart:", treat it as an external Helm chart repo
    # (no path, uses chart + repoURL + optional helm: values)
    {{- if .chart }}
    chart: {{ .chart | quote }}
    {{- else }}
    # Otherwise it's a git-based app (standard path in this repo)
    path: {{ .path | default .name | quote }}
    {{- end }}

    # Helm values/overrides work for BOTH git apps AND external charts
    {{- with .helm }}
    helm:
      {{- . | toYaml | nindent 4 }}
    {{- end }}
  # ───────────────────────────────────────────────────────────────────────────

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
---
{{ end }}