config:
  spec:
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    source:
      repoURL: https://github.com/TheEndBoss101-Web/k8s-gitops_test.git
      targetRevision: HEAD

applications:
  # ── Git-based apps (folders at repo root) ─────────────────────────────────
  - name: traefik
    # Optional: force the Application CR into the argocd namespace (recommended)
    # namespace: argocd
    # destination.namespace defaults to "traefik" (the folder name)

  - name: whoami
    # namespace: argocd   # uncomment if you want the Application CR in argocd ns

  # ── External Helm chart (traefik official chart) ───────────────────────────
  - name: traefik_helm
    # namespace: argocd               # ← recommended (remove the old "default")
    destination:
      namespace: traefik              # where the actual Traefik will be installed
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 40.2.0            # you can bump this anytime
    helm:
      valueFiles:
        # Use raw GitHub URL so Argo CD can fetch your values from this repo
        - https://raw.githubusercontent.com/TheEndBoss101-Web/k8s-gitops_test/main/traefik/values.yaml
      # You can also add extra values directly here if you want to override:
      # values: |
      #   service:
      #     type: LoadBalancer